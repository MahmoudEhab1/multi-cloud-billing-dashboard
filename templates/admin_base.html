<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Billing Admin{% endblock %}</title>
  <style>
    :root{--bg:#0b1117;--panel:#141d27;--panel2:#1a2533;--border:rgba(255,255,255,.08);--text:#f1f5f9;--muted:#94a3b8;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}a{color:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(11,17,23,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}.topin{max-width:1450px;margin:auto;display:flex;align-items:center;gap:14px;padding:14px 20px}.brand{font-weight:800}.brand span{color:var(--blue)}.nav{margin-left:auto;display:flex;gap:8px}.nav a,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);text-decoration:none;padding:9px 13px;border-radius:9px;font-size:13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35);color:#fca5a5}.btn.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35);color:#fcd34d}.btn.good{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35);color:#86efac}.wrap{max-width:1450px;margin:auto;padding:22px 20px 50px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}.card h1,.card h2{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.flash{padding:12px 14px;border-radius:10px;margin-bottom:12px;border:1px solid}.flash.success{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#86efac}.flash.error{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue)}input[type=checkbox]{width:auto}.row{display:flex;align-items:center;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:10px;border-bottom:1px solid var(--border)}.table td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700}.badge.on{background:rgba(34,197,94,.1);color:#86efac}.badge.off{background:rgba(148,163,184,.1);color:#94a3b8}.badge.err{background:rgba(239,68,68,.1);color:#fca5a5}.provider-name{display:flex;align-items:center;gap:9px}.icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--panel2)}form.inline{display:inline}.help{font-size:12px;color:var(--muted);margin-top:5px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px}@media(max-width:800px){.grid.two,.grid.three{grid-template-columns:1fr}.topin{flex-wrap:wrap}.nav{width:100%;margin-left:0}.wrap{padding:14px 10px}}
  </style>
</head>
<body>
  <div class="top"><div class="topin">
    <div class="brand">Exa <span>Billing Admin</span></div>
    {% if session.get('admin_logged_in') %}
    <div class="nav">
      <a href="{{ url_for('admin.index') }}">Providers</a>
      <a href="{{ url_for('admin.password') }}">Admin Password</a>
      <a href="/" target="_blank">Open Dashboard</a>
      <a href="{{ url_for('admin.logout') }}">Logout</a>
    </div>
    {% endif %}
  </div></div>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
