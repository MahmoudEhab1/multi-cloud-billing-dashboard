<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exa Billing — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root[data-theme="light"]{--bg:#F0F4F8;--card:#FFFFFF;--border:rgba(0,0,0,0.08);--text:#0F172A;--text2:#64748B;--text3:#94A3B8;--input-bg:#F8FAFC;--input-border:#E2E8F0;--shadow:0 24px 64px rgba(0,0,0,0.10),0 4px 16px rgba(0,0,0,0.06);--accent:#3B82F6;--err-bg:#FEF2F2;--err-border:#FECACA;--err-text:#DC2626;--grid:rgba(0,0,0,0.04)}
    :root[data-theme="dark"]{--bg:#0B1117;--card:#141D27;--border:rgba(255,255,255,0.07);--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--input-bg:#1A2533;--input-border:rgba(255,255,255,0.08);--shadow:0 24px 64px rgba(0,0,0,0.5),0 4px 16px rgba(0,0,0,0.3);--accent:#3B82F6;--err-bg:rgba(220,38,38,0.08);--err-border:rgba(220,38,38,0.3);--err-text:#FCA5A5;--grid:rgba(255,255,255,0.03)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);transition:background .4s,color .4s}
    body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
    body::after{content:'';position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.12) 0%,transparent 70%);top:-100px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:0}
    .page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .theme-toggle{position:fixed;top:20px;right:20px;z-index:100;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 12px rgba(0,0,0,0.08);transition:all .3s}
    .theme-toggle:hover{transform:scale(1.08)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 44px 40px;width:100%;max-width:420px;box-shadow:var(--shadow);animation:slideUp .55s cubic-bezier(0.16,1,0.3,1) forwards;transition:background .4s,border-color .4s,box-shadow .4s}
    @keyframes slideUp{from{opacity:0;transform:translateY(28px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .header{text-align:center;margin-bottom:36px}
    .logo-wrap{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);border-radius:18px;margin-bottom:20px;box-shadow:0 8px 24px rgba(59,130,246,0.35);animation:floatLogo 4s ease-in-out infinite}
    @keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .logo-wrap svg{width:30px;height:30px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .brand{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px;margin-bottom:6px;transition:color .4s}
    .brand span{color:var(--accent)}
    .tagline{font-size:13px;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:.5px}
    .divider{height:1px;background:var(--border);margin:0 0 28px;transition:background .4s}
    .error-box{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text);padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:10px;animation:shake .4s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
    .field-label{display:block;font-size:12px;font-weight:600;color:var(--text2);font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
    .input-wrap{position:relative;margin-bottom:24px}
    .input-wrap input{width:100%;padding:14px 48px 14px 16px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:12px;font-size:15px;font-family:'Sora',sans-serif;color:var(--text);outline:none;transition:all .25s}
    .input-wrap input::placeholder{color:var(--text3)}
    .input-wrap input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px rgba(59,130,246,0.12)}
    .eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;display:flex;align-items:center;transition:color .2s}
    .eye-btn:hover{color:var(--accent)}
    .btn-submit{width:100%;padding:15px;background:linear-gradient(135deg,#3B82F6 0%,#1D4ED8 100%);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;letter-spacing:.3px;transition:all .25s;box-shadow:0 8px 24px rgba(59,130,246,0.35)}
    .btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(59,130,246,0.45)}
    .btn-submit:active{transform:translateY(0)}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .providers{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px}
    .provider-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--input-bg);border:1px solid var(--border);font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);font-weight:500;transition:all .4s}
    .footer-info{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .secure-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
    .secure-dot{width:6px;height:6px;border-radius:50%;background:#22C55E;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
    .ip-text{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>
<div class="page">
  <div class="card">
    <div class="header">
      <div class="logo-wrap">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="brand">Exa <span>Billing</span></div>
      <div class="tagline">Multi-Cloud Cost Monitor</div>
    </div>
    <div class="divider"></div>

    {% if error %}
    <div class="error-box"><span>⚠</span><span>{{ error }}</span></div>
    {% endif %}

    <form method="POST" action="/login" id="loginForm">
      <label class="field-label" for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" required autofocus autocomplete="current-password" placeholder="Enter your password"/>
        <button type="button" class="eye-btn" onclick="togglePw()">
          <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">Access Dashboard</button>
    </form>

    <div class="providers">
      <div class="provider-chip">☁ Oracle Cloud</div>
      <div class="provider-chip">⚡ Amazon Web Services</div>
    </div>

    <div class="footer-info">
      <div class="secure-badge"><div class="secure-dot"></div>Secure connection</div>
      <div class="ip-text">{{ request.remote_addr }}</div>
    </div>
  </div>
</div>
<script>
  const THEME_KEY='exa-billing-theme';
  function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem(THEME_KEY,t);}
  function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}
  applyTheme(localStorage.getItem(THEME_KEY)||'light');
  function togglePw(){
    const i=document.getElementById('password'),ic=document.getElementById('eyeIcon');
    if(i.type==='password'){i.type='text';ic.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';}
    else{i.type='password';ic.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';}
  }
  document.getElementById('loginForm').addEventListener('submit',function(e){
    const i=document.getElementById('password'),b=document.getElementById('loginBtn');
    if(i.value.trim()===''){e.preventDefault();return;}
    b.disabled=true;b.textContent='Verifying…';
  });
  document.getElementById('password').focus();
</script>
</body>
</html>
