{% extends "admin_base.html" %}
{% block title %}Change Admin Password{% endblock %}
{% block content %}<div class="card" style="max-width:600px"><h1>Change admin password</h1><div class="muted">The password is hashed in SQLite. It is never stored as plaintext.</div><form method="post" style="margin-top:20px"><input type="hidden" name="csrf_token" value="{{ admin_csrf_token() }}"><label>Current password</label><input type="password" name="current_password" required autocomplete="current-password"><label style="margin-top:14px">New password</label><input type="password" name="new_password" required minlength="12" autocomplete="new-password"><label style="margin-top:14px">Confirm new password</label><input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"><button class="btn primary" style="margin-top:16px" type="submit">Update password</button></form></div>{% endblock %}
